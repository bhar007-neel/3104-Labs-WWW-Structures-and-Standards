<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Uranus Fitness</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="index.html"><img src="img/logo.png" alt="Uranus Fitness Logo" class="banner-logo"></a>
        <div class="nav-links">
          <ul>
            <li><a href="about.html">About</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="registration.html">Registration</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <section>
        <h1>Registration Form</h1>
        <form action="index.html" method="get">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="Name">Name:</label><br>
                <input type="text" id="Name" name="Name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="age">Age:</label><br>
                <select id="age" name="age" required>
                    <option value="">Select an option</option>
                    <option value="18-25">18-25</option>
                    <option value="26-35">26-35</option>
                    <option value="36-45">36-45</option>
                    <option value="46+">46+</option>
                </select><br><br>
            </fieldset>

            <fieldset>
                <legend>Membership Tier</legend>
                <label for="tier1">Select Tier:</label><br>
                <input type="radio" id="tier1" name="tier" value="beginner" required>
                <label for="tier1">Beginner</label><br>
                <input type="radio" id="tier2" name="tier" value="intermediate" required>
                <label for="tier2">Intermediate</label><br>
                <input type="radio" id="tier3" name="tier" value="advanced" required>
                <label for="tier3">Advanced</label><br>
            </fieldset>

            <fieldset>
                <legend>About You</legend>
                <label for="about">Tell us about yourself:</label><br>
                <textarea id="about" name="about" rows="4" cols="50"></textarea><br><br>
            </fieldset>

            <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 CSI 3140 Lab 1</p>
    </footer>
  </body>
</html>
