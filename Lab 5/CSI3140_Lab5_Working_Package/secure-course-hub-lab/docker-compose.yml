# CSI 3140 Lab 5 - Secure Course Hub
# Local-only Moodle development environment. Do not expose this stack publicly.
#
# Bitnami moved their community images to the `bitnamilegacy` registry namespace in 2025.
# If `bitnamilegacy/...` ever fails to pull, try the historical `bitnami/...` paths instead.

services:
  mariadb:
    image: bitnamilegacy/mariadb:11.4
    container_name: lab5-mariadb
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_moodle
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/bitnami/mariadb
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 20

  moodle:
    image: bitnamilegacy/moodle:4.5
    container_name: lab5-moodle
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - '8080:8080'
      - '8443:8443'
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - ALLOW_EMPTY_PASSWORD=yes
      # Synthetic administrator account for local testing only.
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=Admin#1234
      - MOODLE_EMAIL=admin@example.invalid
      - MOODLE_SITE_NAME=CSI3140 Lab 5 - Secure Course Hub
      # The site must be reached as 127.0.0.1:8080; a host mismatch with wwwroot
      # bounces every request back to the login page.
      - MOODLE_HOST=127.0.0.1:8080
      - MOODLE_REVERSEPROXY=no
      - MOODLE_SKIP_BOOTSTRAP=no
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
      # Plugin source is mounted read-only; the setup script copies it into the
      # Moodle tree so the container never writes back into the repository.
      - ./plugin:/plugin-src:ro

volumes:
  mariadb_data:
  moodle_data:
  moodledata_data:
