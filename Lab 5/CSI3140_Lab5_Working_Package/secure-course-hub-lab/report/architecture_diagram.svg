<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f8f9fa; stroke: #333; stroke-width: 2; rx: 12; }
      .title { font: bold 22px Arial, sans-serif; fill: #111; }
      .text { font: 17px Arial, sans-serif; fill: #222; }
      .arrow { stroke: #333; stroke-width: 2.5; marker-end: url(#arrow); }
      .small { font: 15px Arial, sans-serif; fill: #444; }
    </style>
  </defs>
  <text x="550" y="35" text-anchor="middle" class="title">Secure Course Hub Architecture</text>

  <rect class="box" x="35" y="165" width="190" height="135"/>
  <text x="130" y="205" text-anchor="middle" class="title">Browser</text>
  <text x="130" y="238" text-anchor="middle" class="text">HTML/CSS</text>
  <text x="130" y="266" text-anchor="middle" class="text">JavaScript fetch()</text>

  <rect class="box" x="285" y="70" width="240" height="155"/>
  <text x="405" y="110" text-anchor="middle" class="title">Moodle Platform</text>
  <text x="405" y="143" text-anchor="middle" class="text">Login + session</text>
  <text x="405" y="171" text-anchor="middle" class="text">$USER identity</text>
  <text x="405" y="199" text-anchor="middle" class="text">Course context</text>

  <rect class="box" x="285" y="285" width="240" height="155"/>
  <text x="405" y="325" text-anchor="middle" class="title">Authorization</text>
  <text x="405" y="358" text-anchor="middle" class="text">Capabilities</text>
  <text x="405" y="386" text-anchor="middle" class="text">Ownership checks</text>
  <text x="405" y="414" text-anchor="middle" class="text">Sesskey / CSRF</text>

  <rect class="box" x="585" y="105" width="245" height="270"/>
  <text x="707" y="145" text-anchor="middle" class="title">Plugin Logic</text>
  <text x="707" y="185" text-anchor="middle" class="text">index.php</text>
  <text x="707" y="218" text-anchor="middle" class="text">ajax.php</text>
  <text x="707" y="251" text-anchor="middle" class="text">request_service.php</text>
  <text x="707" y="292" text-anchor="middle" class="small">Input validation</text>
  <text x="707" y="319" text-anchor="middle" class="small">Business rules</text>
  <text x="707" y="346" text-anchor="middle" class="small">Safe responses</text>

  <rect class="box" x="895" y="165" width="170" height="135"/>
  <text x="980" y="205" text-anchor="middle" class="title">Database</text>
  <text x="980" y="240" text-anchor="middle" class="text">Moodle $DB API</text>
  <text x="980" y="270" text-anchor="middle" class="text">MariaDB/MySQL</text>

  <line class="arrow" x1="225" y1="215" x2="285" y2="155"/>
  <text x="250" y="168" class="small">Page request</text>
  <line class="arrow" x1="285" y1="195" x2="225" y2="255"/>
  <text x="235" y="292" class="small">HTML / JSON</text>

  <line class="arrow" x1="525" y1="150" x2="585" y2="185"/>
  <line class="arrow" x1="525" y1="360" x2="585" y2="300"/>
  <line class="arrow" x1="830" y1="235" x2="895" y2="235"/>
  <line class="arrow" x1="895" y1="270" x2="830" y2="270"/>

  <text x="550" y="485" text-anchor="middle" class="small">Security boundary: Moodle authentication + course capabilities + record ownership + server-side validation</text>
</svg>
